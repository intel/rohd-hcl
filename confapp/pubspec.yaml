name: confapp
description: Configuration app for components.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0

resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  bloc: ^9.0.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  highlight: ^0.7.0
  material_ui: ^1.1.1
  rohd: ^0.6.11
  rohd_devtools_widgets: ^0.1.1
  rohd_hcl: ^0.3.0
  rohd_hierarchy: ^0.1.0
  rohd_schematic_viewer: 0.2.0
  rohd_source_navigator: ^0.1.0
  # 0.5.0 also pulls in its CodeEditor clipboard stack; only highlighting is used.
  syntax_highlight: ^0.4.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.20.0

